<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>새성도스쿨 디딤돌</title><style>:root{--n:#24565b;--a:#efb45e;--bg:#f6f4ef;--c:#fff;--t:#26333d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px Arial,"Malgun Gothic",sans-serif}body.dark{--bg:#16212e;--c:#202d3a;--t:#eef2f5}header{height:70px;background:var(--c);display:flex;align-items:center;gap:12px;padding:0 max(5vw,20px);box-shadow:0 1px 10px #0001}.logo{border:0;background:none;font-size:27px;cursor:pointer}.brand{margin-right:auto}.brand b,.brand small{display:block}.brand small{font-size:11px;color:#87929a;margin-top:3px}select,button,input,textarea{font:inherit}select,.theme,.exit{padding:8px;border:1px solid #dde3e3;border-radius:8px;background:var(--c);color:var(--t)}.exit{background:#bd5555;color:white;border:0}.theme{font-size:18px}main{max-width:1050px;margin:auto;padding:25px 20px}.hero{background:linear-gradient(125deg,#1f505b,#4d8b7b);color:white;border-radius:22px;padding:32px;display:flex;justify-content:space-between}.hero h1{margin:8px 0;font-size:28px}.bar{width:min(420px,65vw);height:11px;background:#ffffff45;border-radius:9px}.bar i,.pbar i{display:block;height:100%;background:var(--a);border-radius:9px}.stats{display:flex;gap:25px;margin-top:17px}.stats b{display:block;font-size:20px}.verse{width:220px;background:#fff9ed;color:#4b463d;border-radius:15px;padding:18px;transition:.6s;transform-style:preserve-3d}.verse:hover{transform:rotateY(180deg)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:17px;margin-top:18px}.card{background:var(--c);border-radius:16px;padding:21px}h2{font-size:17px;margin:0 0 14px}.tabs button{border:0;padding:9px 13px}.tabs .on{background:var(--n);color:#fff}.badge{display:inline-grid;place-items:center;width:74px;height:70px;text-align:center;opacity:.25}.badge.on{opacity:1}.badge b{font-size:25px}.badge small{font-size:10px}.note{margin:8px 0;padding:11px 13px;border-left:3px solid #e6a85e;background:#fff7e9;border-radius:7px}.road{margin-top:18px}.step{border-top:1px solid #e8eceb}.step>button{width:100%;border:0;background:none;color:var(--t);padding:15px 2px;text-align:left;display:flex;gap:12px;align-items:center}.num{width:27px;height:27px;border:1px solid #aab5b5;border-radius:50%;display:grid;place-items:center}.complete .num{background:#55a483;color:white;border:0}.detail{padding:0 39px 15px;color:#718080}.table>div{display:grid;grid-template-columns:1.2fr 1fr .7fr .7fr 1.5fr .7fr;gap:8px;padding:11px 4px;border-top:1px solid #e7ecea}.pbar{height:7px;background:#e6ece8;border-radius:9px;margin-top:4px}.table button,.write button,.add button{border:0;background:#377770;color:#fff;border-radius:7px;padding:7px}.modal{position:fixed;inset:0;background:#142435aa;display:grid;place-items:center}.modal>div{width:290px;background:#fff;color:#26333d;padding:25px;border-radius:15px;text-align:center}.modal input,.modal button,.write textarea,.add input{width:100%;padding:9px;margin:6px 0;border:1px solid #d5dcdc;border-radius:7px}.hide{display:none}.conf{position:fixed;inset:0;display:grid;place-items:center;font-size:60px;pointer-events:none;animation:x 1.5s forwards}@keyframes x{to{transform:scale(1.7);opacity:0}}@media(max-width:700px){.hero,.grid{grid-template-columns:1fr;display:grid}.verse{margin-top:12px}.table>div{grid-template-columns:1fr .6fr .6fr 1fr}.table>div span:nth-child(2){display:none}.stats{gap:15px}}</style></head><body><header><button class="logo" id="logo">🏫</button><div class="brand"><b>새성도스쿨 디딤돌</b><small>믿음의 여정을 함께 걷습니다</small></div><select id="member"></select><button class="theme" id="theme">🌙</button><button class="exit hide" id="exit">🔒 종료</button></header><main><section class="hero"><div><small id="hello"></small><h1>오늘도 한 걸음, 디딤돌 위에서</h1><div class="bar"><i id="all"></i></div><div class="stats"><span>스쿨 1<b id="s1"></b></span><span>스쿨 2<b id="s2"></b></span><span>전체<b id="pct"></b></span></div></div><div class="verse"><b>오늘의 말씀</b><p>“너는 마음을 다하여 여호와를 신뢰하라”</p><small>잠언 3:5 · 카드를 뒤집어 보세요</small></div></section><section class="grid"><article class="card"><h2>💌 인도자가 전하는 격려</h2><div id="notes"></div><div class="write hide" id="write"><textarea id="letter" placeholder="따뜻한 격려를 남겨 주세요"></textarea><button id="send">편지 보내기</button></div></article><article class="card"><h2>성취 배지</h2><div id="badges"></div></article></section><section class="card road"><div style="display:flex;justify-content:space-between"><h2>학습 로드맵</h2><div class="tabs"><button data-c="1" class="on">새성도스쿨 1</button><button data-c="2">새성도스쿨 2</button></div></div><div id="steps"></div></section><section class="card"><h2>전체 성도 진행 현황</h2><div class="table" id="table"></div><div class="add hide" id="add"><input id="newname" placeholder="새 성도 이름"><button id="addbtn">새 성도 추가</button></div></section></main><div class="modal hide" id="modal"><div><h2>🏫 마스터 인증</h2><p>비밀번호를 입력하세요.</p><input id="pw" type="password"><button id="login">입장하기</button></div></div><script>const names=['믿음의 시작','하나님을 아는 길','성경의 약속','구원의 은혜','기도의 기초','예배의 기쁨','말씀의 힘','교회 가족','사랑의 실천','전도의 마음','그리스도의 제자','새로운 출발'];let ms=JSON.parse(localStorage.getItem('didimdol')||'[{"id":1,"name":"김하늘","one":[0,1,2,3,4,5,6],"two":[0,1,2],"notes":["한 걸음씩 성실하게 나아가는 모습이 참 귀해요."]},{"id":2,"name":"이은서","one":[0,1,2,3],"two":[0],"notes":["이번 주에도 함께 말씀 안에서 힘내요!"]},{"id":3,"name":"박준호","one":[0,1],"two":[],"notes":[]}]'),id=ms[0].id,course=1,master=false,taps=0;const $=x=>document.querySelector(x),save=()=>localStorage.setItem('didimdol',JSON.stringify(ms)),me=()=>ms.find(x=>x.id==id),percent=m=>Math.round((m.one.length+m.two.length)/24*100);function render(){let m=me(),d=course==1?m.one:m.two;$('#member').innerHTML=ms.map(x=>`<option value="${x.id}">${x.name} 성도</option>`).join('');$('#member').value=id;$('#hello').textContent=m.name+' 성도의 믿음 여정';$('#s1').textContent=Math.round(m.one.length/12*100)+'%';$('#s2').textContent=Math.round(m.two.length/12*100)+'%';$('#pct').textContent=percent(m)+'%';$('#all').style.width=percent(m)+'%';$('#notes').innerHTML=m.notes.map(x=>`<div class="note">${x}</div>`).join('')||'아직 도착한 편지가 없어요.';let icons=['🌱','🎗️','💖','👟','🛡️','🪖','⚔️'];$('#badges').innerHTML=icons.map((x,i)=>`<span class="badge ${m.one.length+m.two.length>=i*2+1?'on':''}"><b>${m.one.length+m.two.length>=i*2+1?x:'🔒'}</b><small>성취 배지</small></span>`).join('');$('#steps').innerHTML=names.map((x,i)=>`<div class="step ${d.includes(i)?'complete':''}"><button onclick="openStep(${i})"><b class="num">${d.includes(i)?'✓':i+1}</b><span>${x}<small> 세부 주제 확인하기</small></span></button><div class="detail hide" id="d${i}"><label><input type="checkbox" ${d.includes(i)?'checked':''} ${master?'':'disabled'} onchange="toggle(${i})"> 이 단계를 학습 완료했습니다.</label></div></div>`).join('');$('#table').innerHTML='<div><b>성도</b><b>등록일</b><b>스쿨 1</b><b>스쿨 2</b><b>전체 진도</b><b></b></div>'+ms.map(x=>`<div><span>${x.name}</span><span>2026.07</span><span>${x.one.length}/12</span><span>${x.two.length}/12</span><span><i>${percent(x)}%</i><div class="pbar"><i style="width:${percent(x)}%"></i></div></span><button onclick="pick(${x.id})">조회</button></div>`).join('')}function openStep(i){let e=$('#d'+i);e.classList.toggle('hide')}function toggle(i){if(!master)return;let a=course==1?me().one:me().two,q=a.indexOf(i);q<0?a.push(i):a.splice(q,1);save();render();if(a.length==12){let x=document.createElement('div');x.className='conf';x.textContent='🎉 ✨ 🎊';document.body.append(x);setTimeout(()=>x.remove(),1500)}}function pick(x){id=x;render()}$('#member').onchange=e=>pick(+e.target.value);document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{course=+b.dataset.c;document.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',+x.dataset.c==course));render()});$('#theme').onclick=()=>document.body.classList.toggle('dark');$('#logo').onclick=()=>{if(++taps>=2)$('#modal').classList.remove('hide');setTimeout(()=>taps=0,700)};$('#login').onclick=()=>{if($('#pw').value==='1925'){master=true;$('#modal').classList.add('hide');$('#exit').classList.remove('hide');$('#write').classList.remove('hide');$('#add').classList.remove('hide');render()}};$('#exit').onclick=()=>{master=false;$('#exit').classList.add('hide');$('#write').classList.add('hide');$('#add').classList.add('hide');render()};$('#send').onclick=()=>{let v=$('#letter').value.trim();if(v){me().notes.unshift(v);$('#letter').value='';save();render()}};$('#addbtn').onclick=()=>{let n=$('#newname').value.trim();if(n){ms.push({id:Date.now(),name:n,one:[],two:[],notes:[]});$('#newname').value='';save();render()}};render();</script></body></html>
