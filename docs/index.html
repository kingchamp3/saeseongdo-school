<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>새성도스쿨 디딤돌</title>
  <style>
    body{margin:0;background:#f5f3ee;color:#26343d;font:15px Arial,"Malgun Gothic",sans-serif}header{background:#fff;padding:18px 8%;display:flex;align-items:center;gap:12px}.logo{font-size:27px;border:0;background:none}.brand{margin-right:auto}.brand b,.brand small{display:block}.brand small{color:#7b8a91;font-size:11px;margin-top:3px}main{max-width:960px;margin:auto;padding:28px 20px}.hero,.panel{background:#fff;border-radius:16px;padding:24px;margin-bottom:18px}.hero{background:linear-gradient(120deg,#24575b,#4b887e);color:#fff}.hero h1{margin:7px 0}.bar{height:10px;background:#ffffff55;border-radius:9px}.bar i{display:block;width:29%;height:100%;background:#f0ba67;border-radius:9px}.tabs button{border:0;padding:10px 14px}.tabs .on{background:#24575b;color:#fff}.stage{border-top:1px solid #e7ece9}.stage button{width:100%;padding:15px 4px;border:0;background:none;text-align:left;font-size:15px}.stage button b{display:inline-grid;place-items:center;width:27px;height:27px;margin-right:10px;border-radius:50%;background:#eaf0ed;color:#427c69}.topics{display:none;padding:0 42px 17px;color:#64757a;font-size:13px;line-height:1.75}.stage.open .topics{display:block}.topics li{margin:4px 0}.note{padding:12px;background:#fff7e8;border-left:3px solid #e5a55d;border-radius:7px}.master{position:fixed;inset:0;background:#172532a8;display:none;place-items:center}.master>div{background:#fff;padding:24px;border-radius:14px}.master input{display:block;margin:12px 0;padding:9px}.master button{padding:8px 12px;background:#286960;color:#fff;border:0;border-radius:7px}
  </style>
</head>
<body>
  <header><button class="logo" id="logo">🏫</button><div class="brand"><b>새성도스쿨 디딤돌</b><small>새성도스쿨 1 · 실제 커리큘럼</small></div><button id="theme">🌙</button></header>
  <main>
    <section class="hero"><small>김하늘 성도의 믿음 여정</small><h1>오늘도 한 걸음, 디딤돌 위에서</h1><div class="bar"><i></i></div><p>전체 진도 29% · 새성도스쿨 1 진행 중</p></section>
    <section class="panel"><h2>💌 인도자가 전하는 격려</h2><div class="note">한 걸음씩 성실하게 나아가는 모습이 참 귀해요.</div></section>
    <section class="panel"><h2>새성도스쿨 1 로드맵</h2><div id="roadmap"></div></section>
  </main>
  <div class="master" id="master"><div><b>🏫 마스터 인증</b><input id="password" type="password" placeholder="비밀번호"><button id="login">입장하기</button></div></div>
  <script src="curriculum.js"></script>
  <script>
    const road=document.querySelector('#roadmap');
    road.innerHTML=curriculum.map((stage,index)=>`<div class="stage"><button><b>${index+1}</b>${stage.title}</button><ul class="topics">${stage.items.map(item=>`<li>□ ${item}</li>`).join('')}</ul></div>`).join('');
    road.querySelectorAll('.stage button').forEach(button=>button.onclick=()=>button.parentElement.classList.toggle('open'));
    let taps=0;document.querySelector('#logo').onclick=()=>{if(++taps===2)document.querySelector('#master').style.display='grid';setTimeout(()=>taps=0,700)};
    document.querySelector('#login').onclick=()=>{if(document.querySelector('#password').value==='1925'){document.querySelector('#master').style.display='none';alert('마스터 모드가 활성화되었습니다.')}};
    document.querySelector('#theme').onclick=()=>document.body.classList.toggle('dark');
  </script>
</body></html>
